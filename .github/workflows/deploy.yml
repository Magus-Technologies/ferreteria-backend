name: Deploy Backend Laravel

on:
  push:
    branches: ['master', 'main']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax (lint)
        run: |
          find app routes config database -name "*.php" -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.BACKEND_PATH }}

            echo "📥 Pulling latest changes..."
            git pull origin master

            echo "📦 Installing composer dependencies (production)..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "🗃️  Running migrations..."
            php artisan migrate --force

            echo "🧹 Clearing caches..."
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            echo "⚡ Caching for production..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔁 Restarting queue workers (si aplica)..."
            php artisan queue:restart || true

            echo "🔄 Reloading PHP-FPM..."
            systemctl reload php-fpm || systemctl reload php8.2-fpm || true

            echo "✅ Deploy backend completado: $(date)"
